version: 2

models:
  - name: mart_indicadores_diarios
    description: >
      Tabela larga diária (Selic, IPCA, câmbio x3) pronta pro dashboard.
      IPCA e câmbio ficam NULL nos dias em que não há dado novo publicado
      (não é forward-filled de propósito).
    columns:
      - name: data
        tests: [not_null, unique]

  - name: mart_cambio_base100
    description: As 3 moedas normalizadas à base 100 no primeiro dia disponível.
    columns:
      - name: data
        tests: [not_null]
      - name: moeda
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["USD", "EUR", "CNY"]
      - name: valor_base100
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [data, moeda]

  - name: mart_juro_real_vs_cambio
    description: Juro real mensal ao lado do câmbio de fim de mês de cada moeda.
    columns:
      - name: mes
        tests: [not_null, unique]
      - name: juro_real_mensal_pct
        tests: [not_null]

  - name: mart_juros_inflacao
    description: >
      Selic meta e IPCA acumulado em 12 meses (ambos % a.a.), com o juro real
      simplificado (Fisher). Só meses com 12 meses completos de IPCA.
    columns:
      - name: mes
        tests: [not_null, unique]
      - name: ipca_12m_pct
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -10
                max_value: 50
      - name: juro_real_12m_pct
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -30
                max_value: 30

  - name: mart_poder_de_compra
    description: >
      Índice de preços acumulado (IPCA, fim de mês) ao lado do câmbio de fim
      de mês de cada moeda. O rebase para o mês escolhido acontece no frontend.
    columns:
      - name: mes
        tests: [not_null, unique]
      - name: indice_ipca
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
