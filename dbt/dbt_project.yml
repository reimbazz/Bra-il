name: "bra_il"
version: "1.0.0"
config-version: 2

profile: "bra_il"

model-paths: ["models"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# Schema real no Postgres = o nome da pasta (staging/intermediate/marts),
# não "<schema do target>_staging" (comportamento padrão do dbt) — ver
# macros/get_custom_schema.sql.
models:
  bra_il:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      # Materialização "table" recria a tabela a cada `dbt run`, e o GRANT
      # feito à mão em roles.sql some junto com a tabela antiga. O dbt
      # reaplica este grant depois de cada build (ADR 0006).
      +grants:
        select: ["api_readonly"]
