name: CI backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "api/**"
      - "analysis/**"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "api/**"
      - "analysis/**"

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: black --check backend
      - run: pytest backend/tests
      - run: pip-audit -r backend/requirements.txt

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      - run: ruff check api
      - run: black --check api
      - run: pytest api/tests
      - run: pip-audit -r api/requirements.txt

  test-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements-dev.txt
      - run: pip install -r analysis/requirements-dev.txt
      - run: ruff check analysis
      - run: black --check analysis
      - run: pytest analysis/tests
      - run: pip-audit -r analysis/requirements.txt
