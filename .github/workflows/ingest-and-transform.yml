name: Ingestão e transformação

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 03:00 (horário de Brasília, sem horário de verão)
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m backend.ingestion.run_ingestion
        env:
          NEON_DATABASE_URL_INGEST: ${{ secrets.NEON_DATABASE_URL_INGEST }}

  dbt:
    needs: ingest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_PROFILES_DIR: .
      DBT_PGHOST: ${{ secrets.DBT_PGHOST }}
      DBT_PGUSER: ${{ secrets.DBT_PGUSER }}
      DBT_PGPASSWORD: ${{ secrets.DBT_PGPASSWORD }}
      DBT_PGDATABASE: ${{ secrets.DBT_PGDATABASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt
      - run: pip install -r requirements.txt
      - run: dbt deps
      - run: dbt run
      - run: dbt test

  notify:
    needs: [ingest, dbt]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notificar falha no Discord
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"Pipeline Bra\$il falhou: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
