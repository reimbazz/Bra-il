[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Query()/Depends()/Path() no default do parâmetro é o jeito padrão do
# FastAPI declarar parâmetro — não é o antipadrão de "mutável no default"
# que o B008 normalmente pega.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Path"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "analysis/tests", "api/tests"]
